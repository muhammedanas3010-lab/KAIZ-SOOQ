<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KAIZ SOOQ - Business Management App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #F0FDF4; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function KaizSooqApp() {
      const [activeTab, setActiveTab] = useState('home');
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [brandFilter, setBrandFilter] = useState('All');
      const [measurementOpen, setMeasurementOpen] = useState(false);

      // Initial Demo Data
      const [orders, setOrders] = useState([
        {
          id: '1',
          customerName: 'Fathima Riya',
          phone: '9876543210',
          brand: 'Ledi',
          address: 'Kozhikode, Kerala',
          pincode: '673001',
          dressName: 'Designer Lehenga',
          deliveryDate: '2026-08-12',
          sellingPrice: 4500,
          advanceAmount: 2250,
          stitchingCharge: 1200,
          materialRate: 1500,
          shippingCharge: 150,
          courier: 'DTDC',
          trackingNo: 'DT12345678',
          status: 'Adv Paid'
        },
        {
          id: '2',
          customerName: 'Ayesha Mariyam',
          phone: '9123456789',
          brand: 'Bebi',
          address: 'Kochi, Kerala',
          pincode: '682001',
          dressName: 'Baby Girl Frock',
          deliveryDate: '2026-08-10',
          sellingPrice: 2000,
          advanceAmount: 1000,
          stitchingCharge: 600,
          materialRate: 500,
          shippingCharge: 100,
          courier: 'India Post',
          trackingNo: 'IP98765432',
          status: 'Adv Paid'
        }
      ]);

      const [formData, setFormData] = useState({
        brand: 'Ledi',
        customerName: '',
        phone: '',
        whatsapp: '',
        address: '',
        pincode: '',
        dressName: '',
        deliveryDate: '',
        sellingPrice: '',
        advanceAmount: '',
        materialRate: '',
        stitchingCharge: '',
        shippingCharge: '',
        courier: '',
        trackingNo: '',
        // Ledi Optional Measurements
        dressLength: '', bust: '', waist: '', hip: '', shoulder: '', sleeveLength: '', neck: '', armhole: '',
        // Bebi Optional Measurements
        age: '', bebiWaist: '', bebiDressLength: '', bebiSleeveLength: ''
      });

      // Calculations
      const filteredOrders = orders.filter(o => brandFilter === 'All' || o.brand === brandFilter);
      const lediStitchingTotal = orders.filter(o => o.brand === 'Ledi').reduce((acc, curr) => acc + Number(curr.stitchingCharge || 0), 0);
      const bebiStitchingTotal = orders.filter(o => o.brand === 'Bebi').reduce((acc, curr) => acc + Number(curr.stitchingCharge || 0), 0);
      const totalProfit = filteredOrders.reduce((acc, curr) => {
        const net = Number(curr.sellingPrice) - (Number(curr.materialRate || 0) + Number(curr.stitchingCharge || 0) + Number(curr.shippingCharge || 0));
        return acc + net;
      }, 0);

      // Single Nearest Upcoming Delivery Order
      const sortedUpcoming = [...orders].sort((a, b) => new Date(a.deliveryDate) - new Date(b.deliveryDate));
      const nextUpcoming = sortedUpcoming[0];

      // Form Handling
      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => {
          const updated = { ...prev, [name]: value };
          if (name === 'sellingPrice') {
            updated.advanceAmount = value ? (Number(value) * 0.5).toString() : '';
          }
          return updated;
        });
      };

      const handleAddOrder = (e) => {
        e.preventDefault();
        const newOrder = { ...formData, id: Date.now().toString() };
        setOrders(prev => [...prev, newOrder]);
        alert('Order Saved Successfully & Updated to Customer CRM!');
        setActiveTab('saved');
      };

      // Dynamic WhatsApp Triggers with explicit order & UPI ID
      const triggerWhatsApp = (type, order) => {
        const balance = Number(order.sellingPrice) - Number(order.advanceAmount);
        let msg = '';

        if (type === 'adv') {
          msg = `*KAIZ SOOQ Order Confirmed!*\nHello ${order.customerName},\nYour order for ${order.dressName} is confirmed.\nAdvance Paid: ₹${order.advanceAmount}\nRemaining Balance: ₹${balance}\nExpected Delivery: ${order.deliveryDate}`;
        } else if (type === 'remind') {
          msg = `*Payment Reminder - KAIZ SOOQ*\nHello ${order.customerName},\nPlease pay the remaining balance of ₹${balance} via GPay/PhonePe to:\n*Muhammedanas3010-1@oksbi*`;
        } else if (type === 'full') {
          msg = `*Payment Confirmation*\nThank you ${order.customerName}. Your payment for ${order.dressName} has been received in full.`;
          if (order.brand === 'Bebi') msg += `\n\n*KAIZ SOOQ - be every baby’s ideal*`;
        } else if (type === 'dispatched') {
          const trackingLink = `https://www.google.com/search?q=track+${encodeURIComponent(order.courier)}+${encodeURIComponent(order.trackingNo)}`;
          msg = `*Order Dispatched!*\nYour order from KAIZ SOOQ has been shipped.\nCourier: ${order.courier}\nTracking No: ${order.trackingNo}\nTrack your parcel here: ${trackingLink}`;
          if (order.brand === 'Bebi') msg += `\n\n*KAIZ SOOQ - be every baby’s ideal*`;
        }

        window.open(`https://wa.me/91${order.phone}?text=${encodeURIComponent(msg)}`, '_blank');
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-[#F0FDF4] pb-20 shadow-xl relative overflow-hidden">
          
          {/* Top Bar */}
          <header className="bg-gradient-to-r from-[#10B981] to-emerald-700 p-4 text-white flex justify-between items-center shadow-md">
            <button onClick={() => setSidebarOpen(!sidebarOpen)} className="text-2xl font-bold">☰</button>
            <div className="text-center">
              <h1 className="font-extrabold text-xl tracking-wider">KAIZ SOOQ</h1>
              <p className="text-[10px] italic opacity-90">be every baby's ideal</p>
            </div>
            <div className="flex gap-3 text-lg">
              <span>🔍</span>
              <span>🔔</span>
            </div>
          </header>

          {/* Side Navigation Drawer */}
          {sidebarOpen && (
            <div className="fixed inset-0 bg-black/50 z-50 flex">
              <div className="bg-white w-64 h-full p-5 shadow-2xl flex flex-col gap-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h2 className="font-bold text-lg text-emerald-800">KAIZ SOOQ Menu</h2>
                  <button onClick={() => setSidebarOpen(false)} className="text-xl font-bold">✕</button>
                </div>
                <button onClick={() => { setActiveTab('home'); setSidebarOpen(false); }} className="text-left py-2 hover:bg-emerald-50 px-2 rounded">🏠 Dashboard</button>
                <button onClick={() => { setActiveTab('add'); setSidebarOpen(false); }} className="text-left py-2 hover:bg-emerald-50 px-2 rounded">➕ Add New Order</button>
                <button onClick={() => { setActiveTab('saved'); setSidebarOpen(false); }} className="text-left py-2 hover:bg-emerald-50 px-2 rounded">📜 Saved Orders</button>
                <button onClick={() => { setActiveTab('crm'); setSidebarOpen(false); }} className="text-left py-2 hover:bg-emerald-50 px-2 rounded">👥 Customer Directory (CRM)</button>
                <button onClick={() => { setActiveTab('store'); setSidebarOpen(false); }} className="text-left py-2 hover:bg-emerald-50 px-2 rounded">🛍️ Item Store (Inventory)</button>
              </div>
            </div>
          )}

          {/* MAIN DASHBOARD */}
          {activeTab === 'home' && (
            <div className="p-4 space-y-4">
              
              {/* Header Floating Financial Card */}
              <div className="bg-white rounded-2xl p-4 shadow-md border border-emerald-100 flex justify-between items-center">
                <div>
                  <p className="text-xs text-gray-500 font-medium">Total Net Profit</p>
                  <h2 className="text-2xl font-extrabold text-[#10B981]">₹{totalProfit}</h2>
                </div>
                <select 
                  value={brandFilter} 
                  onChange={(e) => setBrandFilter(e.target.value)}
                  className="bg-emerald-50 text-emerald-800 text-xs font-bold border border-emerald-300 rounded-lg p-2"
                >
                  <option value="All">All Brands</option>
                  <option value="Ledi">Ledi Wear</option>
                  <option value="Bebi">Bebi Wear</option>
                </select>
              </div>

              {/* 2 Quick Action Buttons */}
              <div className="grid grid-cols-2 gap-3">
                <button onClick={() => setActiveTab('add')} className="bg-[#10B981] text-white py-3 rounded-xl font-bold shadow hover:bg-emerald-600 transition flex justify-center items-center gap-2">
                  <span>➕</span> Add Order
                </button>
                <button onClick={() => setActiveTab('saved')} className="bg-white text-emerald-800 border border-emerald-300 py-3 rounded-xl font-bold shadow hover:bg-emerald-50 transition flex justify-center items-center gap-2">
                  <span>📜</span> Saved Orders
                </button>
              </div>

              {/* Financial Overview Cards */}
              <div className="grid grid-cols-3 gap-2">
                <div className="bg-blue-50 border border-blue-200 p-3 rounded-xl text-center shadow-sm">
                  <p className="text-[10px] text-blue-600 font-bold uppercase">Ledi Stitching</p>
                  <p className="text-base font-extrabold text-blue-800">₹{lediStitchingTotal}</p>
                </div>
                <div className="bg-purple-50 border border-purple-200 p-3 rounded-xl text-center shadow-sm">
                  <p className="text-[10px] text-purple-600 font-bold uppercase">Bebi Stitching</p>
                  <p className="text-base font-extrabold text-purple-800">₹{bebiStitchingTotal}</p>
                </div>
                <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-center shadow-sm">
                  <p className="text-[10px] text-emerald-600 font-bold uppercase">Net Profit</p>
                  <p className="text-base font-extrabold text-emerald-800">₹{totalProfit}</p>
                </div>
              </div>

              {/* Next Upcoming Delivery (Single Minimal Card) */}
              <div className="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100">
                <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Next Upcoming Delivery</h3>
                {nextUpcoming ? (
                  <div className="flex justify-between items-center bg-emerald-50/60 p-3 rounded-xl border border-emerald-200">
                    <div>
                      <h4 className="text-lg font-bold text-gray-800">{nextUpcoming.customerName}</h4>
                      <p className="text-xs text-emerald-700 font-semibold mt-1">📅 Expected: {nextUpcoming.deliveryDate}</p>
                    </div>
                  </div>
                ) : (
                  <p className="text-sm text-gray-500">No active deliveries scheduled.</p>
                )}
                <button onClick={() => setActiveTab('saved')} className="text-xs text-emerald-600 font-bold mt-3 block text-right hover:underline">
                  View All Orders →
                </button>
              </div>

            </div>
          )}

          {/* ADD ORDER FORM */}
          {activeTab === 'add' && (
            <form onSubmit={handleAddOrder} className="p-4 space-y-4">
              <h2 className="text-lg font-bold text-gray-800 border-b pb-2">Create New Order</h2>

              {/* Brand Selector */}
              <div>
                <label className="text-xs font-bold text-gray-600 block mb-1">Select Brand</label>
                <div className="grid grid-cols-2 gap-2">
                  <button 
                    type="button" 
                    onClick={() => setFormData({...formData, brand: 'Ledi'})}
                    className={`py-2 rounded-lg font-bold text-sm ${formData.brand === 'Ledi' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'}`}
                  >
                    Ledi (Women's)
                  </button>
                  <button 
                    type="button" 
                    onClick={() => setFormData({...formData, brand: 'Bebi'})}
                    className={`py-2 rounded-lg font-bold text-sm ${formData.brand === 'Bebi' ? 'bg-purple-600 text-white' : 'bg-gray-200 text-gray-700'}`}
                  >
                    Bebi (Baby's)
                  </button>
                </div>
              </div>

              {/* Customer Details */}
              <div className="space-y-2">
                <input type="text" name="customerName" placeholder="Customer Name *" required onChange={handleInputChange} className="w-full p-2.5 text-sm bg-white border rounded-lg" />
                <input type="tel" name="phone" placeholder="Phone / WhatsApp Number *" required onChange={handleInputChange} className="w-full p-2.5 text-sm bg-white border rounded-lg" />
                <input type="text" name="address" placeholder="Shipping Address" onChange={handleInputChange} className="w-full p-2.5 text-sm bg-white border rounded-lg" />
                <input type="text" name="pincode" placeholder="Pincode" onChange={handleInputChange} className="w-full p-2.5 text-sm bg-white border rounded-lg" />
              </div>

              {/* Dynamic Measurement Profiles (ALL OPTIONAL) */}
              <div className="border border-emerald-200 bg-white rounded-xl p-3">
                <button 
                  type="button" 
                  onClick={() => setMeasurementOpen(!measurementOpen)}
                  className="flex justify-between items-center w-full text-xs font-bold text-emerald-800"
                >
                  <span>📏 Measurement Profile ({formData.brand}) - OPTIONAL</span>
                  <span>{measurementOpen ? '▲' : '▼'}</span>
                </button>

                {measurementOpen && (
                  <div className="grid grid-cols-2 gap-2 mt-3 text-xs">
                    {formData.brand === 'Ledi' ? (
                      <>
                        <input name="dressLength" placeholder="Dress Length" onChange={handleInputChange} className="p-2 border rounded" />
                        <input name="bust" placeholder="Bust" onChange={handleInputChange} className="p-2 border rounded" />
                        <input name="waist" placeholder="Waist" onChange={handleInputChange} className="p-2 border rounded" />
                        <input name="hip" placeholder="Hip" onChange={handleInputChange} className="p-2 border rounded" />
                        <input name="shoulder" placeholder="Shoulder" onChange={handleInputChange} className="p-2 border rounded" />
                        <input name="sleeveLength" placeholder="Sleeve Length" onChange={handleInputChange} className="p-2 border rounded" />
                        <input name="neck" placeholder="Neck" onChange={handleInputChange} className="p-2 border rounded" />
                        <input name="armhole" placeholder="Armhole" onChange={handleInputChange} className="p-2 border rounded" />
                      </>
                    ) : (
                      <>
                        <input name="age" placeholder="Age (e.g., 0-3M, 2Y)" onChange={handleInputChange} className="p-2 border rounded" />
                        <input name="bebiWaist" placeholder="Waist" onChange={handleInputChange} className="p-2 border rounded" />
                        <input name="bebiDressLength" placeholder="Dress Length" onChange={handleInputChange} className="p-2 border rounded" />
                        <input name="bebiSleeveLength" placeholder="Sleeve Length" onChange={handleInputChange} className="p-2 border rounded" />
                      </>
                    )}
                  </div>
                )}
              </div>

              {/* Order Details */}
              <div className="space-y-2">
                <input type="text" name="dressName" placeholder="Dress Name / Code *" required onChange={handleInputChange} className="w-full p-2.5 text-sm bg-white border rounded-lg" />
                <div>
                  <label className="text-[11px] text-gray-500 font-bold block">Expected Delivery Date *</label>
                  <input type="date" name="deliveryDate" required onChange={handleInputChange} className="w-full p-2.5 text-sm bg-white border rounded-lg" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <input type="text" name="courier" placeholder="Courier Partner" onChange={handleInputChange} className="p-2.5 text-sm bg-white border rounded-lg" />
                  <input type="text" name="trackingNo" placeholder="Tracking Number" onChange={handleInputChange} className="p-2.5 text-sm bg-white border rounded-lg" />
                </div>
              </div>

              {/* Financial Calculations */}
              <div className="bg-emerald-50/50 p-3 rounded-xl border border-emerald-200 space-y-2">
                <h4 className="text-xs font-bold text-emerald-900">Financial Breakdown</h4>
                <div className="grid grid-cols-2 gap-2">
                  <input type="number" name="sellingPrice" placeholder="Selling Price *" required onChange={handleInputChange} className="p-2 text-sm border rounded" />
                  <input type="number" name="advanceAmount" value={formData.advanceAmount} placeholder="Advance Amount" onChange={handleInputChange} className="p-2 text-sm border rounded" />
                </div>
                <div className="grid grid-cols-3 gap-2">
                  <input type="number" name="materialRate" placeholder="Material Cost" onChange={handleInputChange} className="p-1.5 text-xs border rounded" />
                  <input type="number" name="stitchingCharge" placeholder="Stitching Charge" onChange={handleInputChange} className="p-1.5 text-xs border rounded" />
                  <input type="number" name="shippingCharge" placeholder="Courier Cost" onChange={handleInputChange} className="p-1.5 text-xs border rounded" />
                </div>
              </div>

              <button type="submit" className="w-full bg-[#10B981] text-white py-3 rounded-xl font-bold shadow hover:bg-emerald-600">
                Save Order & Update CRM
              </button>
            </form>
          )}

          {/* SAVED ORDERS HISTORY */}
          {activeTab === 'saved' && (
            <div className="p-4 space-y-3">
              <h2 className="text-lg font-bold text-gray-800 border-b pb-2">Saved Orders History</h2>
              {orders.map((order) => (
                <div key={order.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-2">
                  <div className="flex justify-between items-start">
                    <div>
                      <h3 className="font-bold text-gray-800">{order.customerName}</h3>
                      <p className="text-xs text-gray-500">{order.dressName} • <span className="font-semibold text-emerald-600">📅 {order.deliveryDate}</span></p>
                    </div>
                    <span className={`text-xs px-2 py-0.5 rounded font-bold ${order.brand === 'Ledi' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}`}>
                      {order.brand}
                    </span>
                  </div>

                  {/* Dynamic WhatsApp Buttons in Exact Order */}
                  <div className="grid grid-cols-2 gap-2 pt-2 border-t">
                    <button onClick={() => triggerWhatsApp('adv', order)} className="bg-emerald-100 text-emerald-800 py-1.5 rounded text-xs font-bold">
                      1. Adv Confirm
                    </button>
                    <button onClick={() => triggerWhatsApp('remind', order)} className="bg-amber-100 text-amber-800 py-1.5 rounded text-xs font-bold">
                      2. Remind Pay
                    </button>
                    <button onClick={() => triggerWhatsApp('full', order)} className="bg-purple-100 text-purple-800 py-1.5 rounded text-xs font-bold">
                      3. Full Paid
                    </button>
                    <button onClick={() => triggerWhatsApp('dispatched', order)} className="bg-blue-100 text-blue-800 py-1.5 rounded text-xs font-bold">
                      4. Dispatched
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* CUSTOMER DIRECTORY (CRM) */}
          {activeTab === 'crm' && (
            <div className="p-4 space-y-3">
              <h2 className="text-lg font-bold text-gray-800 border-b pb-2">Customer Directory (CRM)</h2>
              {orders.map((cust, idx) => (
                <div key={idx} className="bg-white p-3 rounded-xl border border-emerald-100 shadow-sm flex justify-between items-center">
                  <div>
                    <h4 className="font-bold text-gray-800 text-sm">{cust.customerName}</h4>
                    <p className="text-xs text-gray-500">📞 {cust.phone}</p>
                    <p className="text-[11px] text-gray-400">{cust.address}</p>
                  </div>
                  <span className="text-xs bg-emerald-50 text-emerald-700 font-bold px-2 py-1 rounded">Active</span>
                </div>
              ))}
            </div>
          )}

          {/* ITEM STORE / INVENTORY */}
          {activeTab === 'store' && (
            <div className="p-4 space-y-3">
              <div className="flex justify-between items-center border-b pb-2">
                <h2 className="text-lg font-bold text-gray-800">Item Store</h2>
                <button className="bg-[#10B981] text-white text-xs px-3 py-1.5 rounded-lg font-bold">[+] New Item</button>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-white p-3 rounded-xl border text-center space-y-1">
                  <div className="h-24 bg-gray-100 rounded flex items-center justify-center text-gray-400">📷 Photo</div>
                  <h4 className="text-xs font-bold">Silk Fabric</h4>
                  <p className="text-[10px] text-blue-600 font-bold">Ledi Wear</p>
                  <p className="text-xs font-extrabold text-emerald-600">₹850/m</p>
                  <button className="w-full bg-emerald-100 text-emerald-800 py-1 rounded text-[11px] font-bold">Share to WA</button>
                </div>
              </div>
            </div>
          )}

          {/* Bottom Fixed Navigation Bar */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 flex justify-around py-2 z-40 text-xs text-gray-600">
            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center ${activeTab === 'home' ? 'text-[#10B981] font-bold' : ''}`}>
              <span>🏠</span> Home
            </button>
            <button onClick={() => setActiveTab('saved')} className={`flex flex-col items-center ${activeTab === 'saved' ? 'text-[#10B981] font-bold' : ''}`}>
              <span>📦</span> Orders
            </button>
            <button onClick={() => setActiveTab('crm')} className={`flex flex-col items-center ${activeTab === 'crm' ? 'text-[#10B981] font-bold' : ''}`}>
              <span>👥</span> Customers
            </button>
            <button onClick={() => setActiveTab('store')} className={`flex flex-col items-center ${activeTab === 'store' ? 'text-[#10B981] font-bold' : ''}`}>
              <span>🛍️</span> Store
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<KaizSooqApp />);
  </script>
</body>
</html>
